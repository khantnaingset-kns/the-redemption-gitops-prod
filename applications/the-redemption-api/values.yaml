replicaCount: 2

image:
  repository: khantki/the-redemption-api
  pullPolicy: IfNotPresent
  tag: "0.0.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

command:
  - node
args:
  - -e
  - >-
    require('http').createServer((req,res)=>{res.writeHead(200,{'content-type':'application/json'});res.end(JSON.stringify({status:'ok',service:'the-redemption-api',path:req.url}));}).listen(process.env.PORT||3000,'0.0.0.0')

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: NodePort
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  PORT: "3000"
  NODE_ENV: production
  DB_HOST: the-redemption-db.cg74uki82ibt.us-east-1.rds.amazonaws.com
  DB_PORT: "5432"
  DB_NAME: theredemptiondb
  DB_USER: dbadmin
  DB_SSL: "true"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"

secret:
  enabled: true
  existingSecret: ""

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: the-redemption-secrets
    kind: ClusterSecretStore
  target:
    name: "rds-db-3aced137-9445-4dcf-931a-5fad9c27a5d5"
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: rds!db-843090ee-190a-47a3-b399-87c746774d83
        property: password
  dataFrom: []

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

dbMigration:
  enabled: true
  command:
    - node
  args:
    - dist/database/migrate.js
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}

serviceMonitor:
  enabled: true
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  honorLabels: false
  namespaceSelector: {}
  relabelings: []
  metricRelabelings: []

nodeSelector:
  workload-tier: api
  kubernetes.io/arch: arm64

tolerations:
  - key: workload-tier
    value: api
    effect: NoSchedule

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload-tier
              operator: In
              values:
                - api
            - key: kubernetes.io/arch
              operator: In
              values:
                - arm64
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: the-redemption-api

topologySpreadConstraints:
  - maxSkew: 2
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: the-redemption-api
  - maxSkew: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: the-redemption-api
