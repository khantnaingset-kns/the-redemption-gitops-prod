apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Prevents the use of the `latest` tag in container images. The `latest` tag
      is mutable and can lead to unexpected behavior, non-reproducible deployments,
      and difficulty in rollbacks.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Using the `latest` tag is not allowed. Specify an explicit image version."
        pattern:
          spec:
            =(initContainers):
              - image: "!*:latest"
            =(ephemeralContainers):
              - image: "!*:latest"
            containers:
              - image: "!*:latest"
