apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-150"
spec:
  project: infrastructure
  sources:
    - repoURL: https://github.com/khantnaingset-kns/the-redemption-gitops-prod.git
      targetRevision: main
      ref: argocd_values
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.17.2
      helm:
        valueFiles:
          - $argocd_values/infrastructure/cilium/values.yaml
  destination:
    namespace: kube-system
    name: in-cluster
  # https://docs.cilium.io/en/latest/configuration/argocd-issues/#solution
  ignoreDifferences:
    - kind: ConfigMap
      name: hubble-ca-cert
      jsonPointers:
        - /data/ca.crt
    - kind: Secret
      name: hubble-relay-client-certs
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - kind: Secret
      name: hubble-server-certs
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - kind: Secret
      name: cilium-ca
      jsonPointers:
        - /data/ca.crt
        - /data/ca.key
    - kind: ConfigMap
      name: cilium-config
      jsonPointers:
        - /data/ipam-multi-pool-pre-allocation
