ec2NodeClasses:
  enabled: true
  items:
    - name: default
      labels: {}
      annotations: {}
      role: prod-the-redemption-karpenter-node-role
      instanceProfile: ""
      amiFamily: AL2023
      amiSelectorTerms:
        - alias: al2023@latest
      subnetSelectorTerms:
        - tags:
            karpenter.sh/discovery: prod-the-redemption
      securityGroupSelectorTerms:
        - tags:
            karpenter.sh/discovery: prod-the-redemption
      blockDeviceMappings:
        - deviceName: /dev/xvda
          ebs:
            volumeSize: 100Gi
            volumeType: gp3
            deleteOnTermination: true
      metadataOptions:
        httpEndpoint: enabled
        httpTokens: required
        httpPutResponseHopLimit: 2
      tags:
        ManagedBy: karpenter
        Environment: production

nodePools:
  enabled: true
  items:
    - name: general-purpose
      labels:
        workload-tier: general-purpose
        node-group: infrastructure
      annotations: {}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t3.large
            - t3.xlarge
            - t3.2xlarge
      taints:
        - key: workload-tier
          value: general-purpose
          effect: NoSchedule
      startupTaints: []
      limits:
        cpu: "500"
        memory: 1000Gi
      disruption:
        consolidationPolicy: WhenEmptyOrUnderutilized
        consolidateAfter: 5m
      expireAfter: 720h
      terminationGracePeriod: 48h
      weight: 90

    - name: api
      labels:
        workload-tier: api
        node-group: compute-optimized
      annotations: {}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t3.large
            - t3.xlarge
            - t3.2xlarge
      taints:
        - key: workload-tier
          value: api
          effect: NoSchedule
      startupTaints: []
      limits:
        cpu: "200"
        memory: 500Gi
      disruption:
        consolidationPolicy: WhenEmptyOrUnderutilized
        consolidateAfter: 5m
      expireAfter: 720h
      terminationGracePeriod: 48h
      weight: 100
